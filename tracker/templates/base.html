<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Bazaar Tracker{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <nav class="topnav">
    <a href="{{ url_for('index') }}">Local</a>
    <a href="{{ url_for('global_view') }}">Global</a>
    <a href="{{ url_for('items_view') }}">Items</a>
    <a href="{{ url_for('settings_view') }}">Paramètres</a>
  </nav>
  {% with messages = get_flashed_messages() %}
    {% if messages %}
    <div class="flash-messages">
      {% for message in messages %}
      <div class="flash">{{ message }}</div>
      {% endfor %}
    </div>
    {% endif %}
  {% endwith %}
  {% block body %}{% endblock %}
</body>
</html>
